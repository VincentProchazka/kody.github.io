<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShiftLog | Personal Garage & Vehicle Maintenance Tracker</title>
  <meta name="description" content="High-tech automotive telemetry and vehicle maintenance log. Track fuel economy, service schedules, tire pressures, and garage analytics in a futuristic cockpit interface." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m12 6 2 4 4 2-4 2-2 4-2-4-4-2 4-2z'/></svg>" />

  <!-- Google Fonts: Inter (UI), Rajdhani (Headers & Tech), Roboto Mono & Orbitron (Gauges & Numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            tech: ['Rajdhani', 'sans-serif'],
            mono: ['Roboto Mono', 'monospace'],
            gauge: ['Orbitron', 'sans-serif'],
          },
          colors: {
            carbon: {
              950: '#07080b',
              900: '#0c0e14',
              850: '#11141c',
              800: '#161924',
              700: '#202534',
              600: '#2d3448',
            },
            racing: {
              DEFAULT: '#ef4444',
              50: '#fef2f2',
              400: '#f87171',
              500: '#ef4444',
              600: '#dc2626',
              glow: 'rgba(239, 68, 68, 0.45)',
            },
            electric: {
              DEFAULT: '#00b4d8',
              400: '#38bdf8',
              500: '#00b4d8',
              600: '#0284c7',
              glow: 'rgba(0, 180, 216, 0.45)',
            },
            neon: {
              DEFAULT: '#10b981',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              glow: 'rgba(16, 185, 129, 0.45)',
            },
            amberGauge: {
              DEFAULT: '#f59e0b',
              glow: 'rgba(245, 158, 11, 0.45)',
            }
          },
          boxShadow: {
            'cockpit': '0 12px 36px -8px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08)',
            'gauge-inset': 'inset 0 4px 12px rgba(0,0,0,0.8), inset 0 0 2px rgba(255,255,255,0.08)',
            'neon-red': '0 0 20px rgba(239, 68, 68, 0.45)',
            'neon-blue': '0 0 20px rgba(0, 180, 216, 0.45)',
            'neon-green': '0 0 20px rgba(16, 185, 129, 0.45)',
            'metallic': '0 1px 3px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.1)',
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'sweep': 'sweep 2s ease-out forwards',
            'glow-pulse': 'glowPulse 2s ease-in-out infinite alternate',
          },
          keyframes: {
            glowPulse: {
              '0%': { filter: 'drop-shadow(0 0 4px rgba(239, 68, 68, 0.4))' },
              '100%': { filter: 'drop-shadow(0 0 16px rgba(239, 68, 68, 0.8))' },
            }
          }
        }
      }
    };
  </script>

  <!-- Canvas Confetti for celebratory service logs -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for direct in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0c0e14;
    }
    ::-webkit-scrollbar-thumb {
      background: #202534;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }

    /* Subtle Carbon Fiber Background Pattern */
    body {
      background-color: #07080b;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(20, 28, 48, 0.4) 0%, transparent 60%),
        radial-gradient(circle at 90% 90%, rgba(239, 68, 68, 0.05) 0%, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* Metallic Panel Glassmorphism */
    .cockpit-card {
      background: linear-gradient(165deg, rgba(22, 25, 36, 0.85) 0%, rgba(12, 14, 20, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 1rem;
      position: relative;
    }

    .cockpit-card-interactive {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cockpit-card-interactive:hover {
      border-color: rgba(56, 189, 248, 0.25);
      box-shadow: 0 16px 40px -4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Metallic Brushed Line Effect */
    .brushed-border {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      height: 1px;
    }

    /* Odometer Digit Look */
    .odometer-digit {
      background: linear-gradient(180deg, #11141c 0%, #06070a 50%, #151822 100%);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }
  </style>
</head>
<body class="antialiased selection:bg-racing selection:text-white">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
